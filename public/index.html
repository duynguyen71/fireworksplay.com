<head>
  <meta charset="utf-8" />

  <!-- Primary Meta Tags -->
  <title>Fireworks Play - Amazing Fireworks Simulator</title>
  <meta name="title" content="Fireworks Play - Amazing Fireworks Simulator" />
  <meta name="description"
    content="A fun and amazing fireworks simulation game that will blow your mind. Try it now for free!" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://fireworksplay.com/" />
  <meta property="og:title" content="Fireworks Play - Amazing Fireworks Simulator" />
  <meta property="og:description"
    content="A fun and amazing fireworks simulation game that will blow your mind. Try it now for free!" />
  <meta property="og:image" content="https://fireworksplay.com/og-image.png" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://fireworksplay.com/" />
  <meta property="twitter:title" content="Fireworks Play - Amazing Fireworks Simulator" />
  <meta property="twitter:description"
    content="A fun and amazing fireworks simulation game that will blow your mind. Try it now for free!" />
  <meta property="twitter:image" content="https://fireworksplay.com/og-image.png" />

  <!-- Favicon -->
  <link rel="icon" href="%PUBLIC_URL%/app-icon64.png" sizes="64x64" />
  <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/app-icon180.png" />

  <!-- Manifest -->
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

  <!-- Preconnect Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Load Google Font - Poppins -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- GitHub Pages SPA Redirect -->
  <base href="/" />
  <script type="text/javascript">
    (function (l) {
      if (l.search[1] === "/") {
        var decoded = l.search
          .slice(1)
          .split("&")
          .map(function (s) {
            return s.replace(/~and~/g, "&");
          })
          .join("?");
        window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
      }
    })(window.location);
  </script>

  <!-- Optional external script (Typewriter Effect) - async -->
  <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js" async></script>
</head>

<body>

</body>
