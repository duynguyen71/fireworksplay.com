name: Deploy Fireworks Play to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

# Environment variables for the entire workflow
env:
  NODE_ENV: production
  CI: true
  DISABLE_ESLINT_PLUGIN: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Shorter timeout for streamlined build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Build the project (no ESLint)
        run: npm run build
        env:
          REACT_APP_WORKER_API_URL: ${{ secrets.REACT_APP_WORKER_API_URL || 'https://fireworksplay-database-api.khanhduy-dev-bt.workers.dev' }}

      - name: Deploy to GitHub Pages
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          enable_jekyll: false

  notify:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Prepare notification
        id: info
        shell: bash
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Notify Telegram
        uses: up9cloud/action-notify@v0.4
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE: |
            *FIREWORKS PLAY — BUILD*

            *Result:* `${{ needs.build-and-deploy.result == 'success' && 'SUCCESS' || (needs.build-and-deploy.result == 'failure' && 'FAILED' || 'CANCELLED') }}`
            *Repository:* `${{ github.repository }}`
            *Branch:* `${{ github.head_ref || github.ref_name }}`
            *Commit:* [`${{ steps.info.outputs.short_sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            *Workflow:* `${{ github.workflow }}`
            *Triggered by:* `${{ github.actor }}`

            [Open workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
