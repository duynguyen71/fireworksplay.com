name: Deploy Fireworks Play to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

# Environment variables for the entire workflow
env:
  NODE_ENV: production
  CI: true
  DISABLE_ESLINT_PLUGIN: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Shorter timeout for streamlined build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:ci

      - name: Build the project (no ESLint)
        run: npm run build
        env:
          REACT_APP_WORKER_API_URL: ${{ secrets.REACT_APP_WORKER_API_URL || 'https://fireworksplay-database-api.khanhduy-dev-bt.workers.dev' }}

      - name: Deploy to GitHub Pages
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          enable_jekyll: false

  notify:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
    timeout-minutes: 5

    steps:
      - name: Prepare notification
        shell: python
        env:
          DEPLOY_RESULT: ${{ needs.build-and-deploy.result }}
        run: |
          import html
          import json
          import os
          from pathlib import Path

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          message = (event.get("head_commit") or {}).get("message", "")
          lines = [line.strip() for line in message.splitlines() if line.strip()]
          title = lines[0] if lines else "Manual deployment"
          if title.startswith("Merge pull request #") and len(lines) > 1:
              title = lines[1]

          escape = html.escape
          sha = os.environ["GITHUB_SHA"]
          repository = os.environ["GITHUB_REPOSITORY"]
          base = f"https://github.com/{repository}"
          result = {
              "success": "SUCCESS", "failure": "FAILED",
              "cancelled": "CANCELLED", "skipped": "SKIPPED",
          }.get(os.environ["DEPLOY_RESULT"], "UNKNOWN")
          text = (
              "<b>FIREWORKS PLAY</b>\n"
              f"Website Deployment | <b>{result}</b>\n\n"
              "<b>Website:</b> fireworksplay.com\n"
              f"<b>Branch:</b> <code>{escape(os.environ['GITHUB_REF_NAME'])}</code>\n"
              f"<b>Commit:</b> <code>{escape(sha[:8])}</code>\n"
              f"<b>Change:</b> {escape(title[:200])}\n"
              f"<b>Run:</b> #{escape(os.environ['GITHUB_RUN_NUMBER'])}\n\n"
              '<a href="https://fireworksplay.com">Open Website</a> | '
              f'<a href="{escape(base)}/actions/runs/{escape(os.environ["GITHUB_RUN_ID"])}">View Deployment</a>'
          )
          # The action runs envsubst; preserve literal dollar signs in commit titles.
          Path("telegram-notification.html").write_text(text.replace("$", "&#36;"))

      - name: Notify Telegram
        uses: up9cloud/action-notify@v0.4
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TEMPLATE_PATH: /github/workspace/telegram-notification.html
          TELEGRAM_PARSE_MODE: HTML
