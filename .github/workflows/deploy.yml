name: Deploy Fireworks Play to GitHub Pages

on:
  push:
    branches:
      - master
  pull_request:
    types:
      - closed
    branches:
      - master
  workflow_dispatch:

jobs:
  install:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    outputs:
      node-version: ${{ steps.node.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Node.js
        id: node
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Cache NPM dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install

  build:
    needs: install
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Cache NPM dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install

      - name: Generate Updates Index
        run: node src/data/updates/auto-generate-index.js

      - name: Build the project
        run: npm run build

      - name: Upload build folder
        uses: actions/upload-artifact@v4
        with:
          name: build-folder
          path: build/

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Cache NPM dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install

      - name: Download build folder
        uses: actions/download-artifact@v4
        with:
          name: build-folder
          path: build/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build

  notify:
    needs: deploy
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Set Telegram Message
        id: set_message
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "message=✅ *Fireworks Play Deployed Successfully!* 🚀" >> $GITHUB_ENV
          else
            echo "message=❌ *Fireworks Play Deployment Failed!* 💥" >> $GITHUB_ENV
          fi

      - name: Send Telegram Notification
        uses: up9cloud/action-notify@v0.4
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_PARSE_MODE: markdownv2
          TELEGRAM_MESSAGE: |
            ${{ env.message }}

            *Repo*: \`${{ github.repository }}\`
            *Branch*: \`${{ github.ref_name }}\`
            *Commit*: \`${{ github.sha }}\`
            *Status*: \`${{ needs.deploy.result }}\`

            👉 [View Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})